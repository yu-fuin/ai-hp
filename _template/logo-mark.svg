<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ロゴ（仮）">
  <!-- 仮のロゴです。会社ごとのロゴに差し替える（色は #0e2c66 / #2e9bd8 / #edab31 が使われています） -->
  <rect width="64" height="64" rx="14" fill="#0e2c66"/>
  <rect x="14" y="14" width="36" height="36" rx="6" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="32" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="sans-serif">LOGO</text>
</svg>
